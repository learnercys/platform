name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint (Helm, kubeconform, Terraform, tflint, Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - run: make lint

  e2e:
    name: e2e on kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: install kind
        run: go install sigs.k8s.io/kind@v0.33.0
      - name: clone the service repos, build images, deploy everything
        run: make up REPOS_DIR=${{ runner.temp }}/repos
      - name: smoke tests with each service's own tools
        run: make smoke REPOS_DIR=${{ runner.temp }}/repos
      - name: diagnostics
        if: failure()
        run: |
          kubectl get pods -A
          kubectl get events -A --sort-by=.lastTimestamp | tail -50
          for ns in event-pipeline ledger llm-gateway deps; do kubectl -n $ns logs --all-containers --prefix -l app.kubernetes.io/instance --tail 50 || true; done
