apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
data:
  ledger-realm.json: |
    {{- required "set keycloak.realm with --set-file" .Values.keycloak.realm | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      enableServiceLinks: false # no FOO_PORT=tcp://... env vars (they clash with MOTO_PORT etc.)
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          args: [start-dev, --import-realm, --http-port=8080, --health-enabled=true]
          env:
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: admin }
            # Same issuer for tokens fetched from the host and keys fetched in-cluster.
            - { name: KC_HOSTNAME, value: {{ .Values.keycloak.publicUrl | quote }} }
            - { name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true" }
          ports: [{ containerPort: 8080 }, { containerPort: 9000, name: management }]
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 3
            failureThreshold: 60
          resources:
            requests: { cpu: 200m, memory: 512Mi }
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import }
      volumes:
        - name: realm
          configMap: { name: keycloak-realm }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  type: NodePort
  selector: { app: keycloak }
  ports: [{ port: 8080, targetPort: 8080, nodePort: {{ .Values.keycloak.nodePort }} }]
