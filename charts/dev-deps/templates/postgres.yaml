apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  00-databases.sql: |
    {{- range .Values.postgres.databases }}
    CREATE DATABASE {{ . }};
    {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      enableServiceLinks: false # no FOO_PORT=tcp://... env vars (they clash with MOTO_PORT etc.)
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - { name: POSTGRES_PASSWORD, value: postgres }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: [pg_isready, -U, postgres] }
            periodSeconds: 2
          resources:
            requests: { cpu: 100m, memory: 128Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: init
          configMap: { name: postgres-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: NodePort
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432, nodePort: {{ .Values.postgres.nodePort }} }]
