apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
      kubelet_stats:
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_NAME}:10250
        insecure_skip_verify: true
        collection_interval: 15s
        metric_groups: [pod, container]
      file_log:
        include: [/var/log/pods/*/*/*.log]
        # Don't ship the collector's own logs back to itself.
        exclude: [/var/log/pods/{{ .Release.Namespace }}_otel-collector*/*/*.log]
        start_at: end
        include_file_path: true
        operators:
          - type: container # parses the CRI format and sets k8s.* attributes from the path
          - type: json_parser # the services log JSON; plain lines pass through
            if: 'body matches "^\\{"'
            parse_to: attributes
            on_error: send_quiet
    processors:
      memory_limiter: { check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 25 }
      k8s_attributes:
        auth_type: serviceAccount
        filter: { node_from_env_var: K8S_NODE_NAME }
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.deployment.name, k8s.node.name]
          labels:
            - { tag_name: service.name, key: app.kubernetes.io/name, from: pod }
            - { tag_name: service.namespace, key: app.kubernetes.io/part-of, from: pod }
        pod_association:
          - sources: [{ from: resource_attribute, name: k8s.pod.uid }]
          - sources: [{ from: resource_attribute, name: k8s.pod.name }, { from: resource_attribute, name: k8s.namespace.name }]
          - sources: [{ from: connection }]
      batch: {}
    exporters:
      otlp_http:
        endpoint: {{ .Values.collector.exportEndpoint }}
    service:
      telemetry:
        logs: { level: warn }
      pipelines:
        traces:  { receivers: [otlp], processors: [memory_limiter, k8s_attributes, batch], exporters: [otlp_http] }
        metrics: { receivers: [otlp, kubelet_stats], processors: [memory_limiter, k8s_attributes, batch], exporters: [otlp_http] }
        logs:    { receivers: [otlp, file_log], processors: [memory_limiter, k8s_attributes, batch], exporters: [otlp_http] }
