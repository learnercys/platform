{{- if .Values.lgtm.enabled }}
# Grafana + Prometheus + Tempo + Loki in one pod, for local development only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  platform-provider.yaml: |
    apiVersion: 1
    providers:
      - name: platform
        folder: Platform
        type: file
        options: { path: /dashboards/platform }
  {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
spec:
  replicas: 1
  selector:
    matchLabels: { app: lgtm }
  template:
    metadata:
      labels: { app: lgtm }
      annotations:
        checksum/dashboards: {{ .Files.Glob "dashboards/*.json" | toString | sha256sum | trunc 16 }}
    spec:
      containers:
        - name: lgtm
          image: {{ .Values.lgtm.image }}
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Admin }
          ports:
            - { name: grafana, containerPort: 3000 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          readinessProbe:
            httpGet: { path: /api/health, port: grafana }
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests: { cpu: 200m, memory: 768Mi }
          volumeMounts:
            - name: dashboards
              mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/platform.yaml
              subPath: platform-provider.yaml
            - { name: dashboards, mountPath: /dashboards/platform }
      volumes:
        - name: dashboards
          configMap: { name: grafana-dashboards }
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm
spec:
  selector: { app: lgtm }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: NodePort
  selector: { app: lgtm }
  ports:
    - { name: http, port: 3000, targetPort: 3000, nodePort: {{ .Values.lgtm.grafanaNodePort }} }
{{- end }}
